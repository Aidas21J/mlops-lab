apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mlflow.replicaCount }}
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
      - name: mlflow
        image: "{{ .Values.mlflow.image }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir psycopg2-binary
            mlflow server \
              --backend-store-uri postgresql+psycopg2://{{ .Values.postgres.db.user }}:{{ .Values.postgres.db.password }}@postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.db.name }} \
              --default-artifact-root /tmp/mlflow/artifacts \
              --host 0.0.0.0 \
              --port {{ .Values.mlflow.port }}
        ports:
        - containerPort: {{ .Values.mlflow.port }}
          name: mlflow-port
        volumeMounts:
        - mountPath: /tmp/mlflow/artifacts
          name: mlflow-artifacts
      volumes:
      - name: mlflow-artifacts
        persistentVolumeClaim:
          claimName: mlflow-artifacts-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mlflow.storageSize }}

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  ports:
  - port: {{ .Values.mlflow.port }}
    targetPort: {{ .Values.mlflow.port }}
    nodePort: {{ .Values.mlflow.nodePort }}
  selector:
    app: mlflow-server
